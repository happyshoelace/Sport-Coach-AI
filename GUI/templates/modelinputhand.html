            <div class="uploadStep1">
            <h1>Which hand do you use?</h1>
            <p>To provide you with the best possible feedback, please let us know which hand you use for fencing.</p>
            <form id="hand-form" action="/modelvideoInput" method="POST">
                <label for="hand">Select your dominant hand:</label>
                <select id="hand" name="hand" required>
                    <option value="" disabled selected>Select your hand</option>
                    <option value="right">Right Hand</option>
                    <option value="left">Left Hand</option>
                </select>
                <button type="submit">Continue</button>
                </form>
            </div>
        </section>
